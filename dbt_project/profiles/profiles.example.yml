# Copy to profiles.yml (gitignored) and fill in, or export the PG_* vars.
healthcare_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', 5432) | int }}"
      dbname: "{{ env_var('PG_DB', 'healthcare') }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      schema: public
      threads: 4
